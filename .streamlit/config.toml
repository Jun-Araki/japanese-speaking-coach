# The look, set here rather than only in CSS.
#
# Injected CSS was not enough: a phone in dark mode gets Streamlit's dark theme, and
# the app came back white-on-black with none of the paper-and-ink palette. The theme
# section is applied before anything renders and is not something a viewer's system
# setting can override, so the page looks the same to everybody. app/theme.py still
# carries the CSS that this cannot express — the hairline rules, the serif headings,
# the accent used only on a corrected sentence.
[theme]
base = "light"
backgroundColor = "#faf6ef"
secondaryBackgroundColor = "#f2ece1"
textColor = "#1c1a17"
primaryColor = "#7a5c3e"
font = "serif"

[client]
# Hides the developer menu, and with it the keyboard shortcuts behind it — pressing
# "C" was opening a "Clear caches" dialog on a learner's screen, which is a button
# that should not exist for someone practising Japanese.
toolbarMode = "viewer"

[server]
# The recordings are short — a beginner says one sentence — and the transcription
# limit in speech/voice.py is 8MB. This stops anything larger reaching the process.
maxUploadSize = 10

# NO FILE WATCHER, SO THAT THE LOG IS READABLE. The watcher walks every imported
# module looking for local source files, and `transformers` imports its submodules
# lazily on attribute access — so the walk itself triggers real imports of image
# processors that want torchvision, which this app has no use for and does not
# install. Streamlit catches each one and logs the traceback: several hundred lines,
# every boot, on the deployment (seen 2026-08-24) and locally alike.
#
# The deploy runbook tells whoever is running the demo to read this log when the
# audio goes quiet — `[speak] no audio for …` carries the reason, and a 429 there is
# the free tier rather than a fault. One line in three hundred tracebacks, found on a
# phone at a meetup, is a line nobody finds.
#
# WHAT IT COSTS is auto-reload while developing: edit a file and the running app no
# longer restarts itself. That was already unreliable — on 2026-08-22 an edit to
# app/limits.py left the running app throwing ImportError for a name that was right
# there in the file, because the watcher reloads the entry script and not always what
# it imports. Restarting was already the honest way to pick up a change.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
