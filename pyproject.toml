[project]
name = "japanese-speaking-coach"
version = "0.1.0"
description = "Speaking practice for beginner learners of Japanese, with corrections after the conversation"
requires-python = ">=3.11"

# Retrieval lands by 30 August; the API layer and the graph by 6 September.
# Their dependencies are added then, not now.
#
# The model provider goes through LangChain so that swapping it is a one-line
# change. Gemini is used because a key is already available; Anthropic is the
# preferred provider and is swapped back in once billing is sorted. Both
# integration packages are installed so the swap needs no dependency change.
#
# Retrieval arrives with chromadb and sentence-transformers. The embedding model is
# multilingual because the query is a learner's Japanese sentence and the articles
# are written in English with Japanese examples — an English-only model would score
# the two sides of every article differently. Chroma is the smallest thing that
# stores vectors and gives back the top few with their ids and distances; nothing
# here needs a server, and the index is rebuilt at startup from eight files.
#
# THE PUBLISHED BUILD MAY NOT TAKE THESE. sentence-transformers pulls torch, a few
# hundred megabytes, and Streamlit Community Cloud runs Python 3.14 where the wheel
# may not exist — while this venv is 3.12. If the deploy fails on it, the published
# app drops retrieval and the measurements go on running locally, which loses no
# number (week-3 tasklist, week 5).
#
# SudachiPy is installed, for the vocabulary-level check. Japanese writes no
# spaces between words, so deciding whether the AI's reply sits above a learner's
# level needs the reply split into words first — string matching cannot find a
# boundary that is not written down. The dictionary is a separate package of
# roughly 70MB; it is installed at build time, which matters for the Docker
# image built in the 14-20 September week. Both are Apache-2.0 with no share-alike condition.
dependencies = [
    "langchain",
    "langchain-google-genai",
    "langchain-anthropic",
    "streamlit",
    "python-dotenv",
    "sudachipy",
    "sudachidict-core",
    "chromadb",
    "sentence-transformers",
    "langgraph",
    "fastapi",
    "uvicorn",
    # Continuous listening: the microphone stays open and the turn ends on silence,
    # instead of a press to start and a press to stop. Added 2026-08-21 when that
    # became a requirement for the applications rather than a nice-to-have.
    "streamlit-webrtc",
    # Imported directly by app/continuous.py, and arriving transitively today
    # anyway: numpy through streamlit, av through streamlit-webrtc. Named here
    # because a file that imports a package should not depend on another package
    # continuing to want it.
    "numpy",
    "av",
    # DECLARED SO THAT IT CAN BE POINTED SOMEWHERE. torch arrives through
    # sentence-transformers either way, but `[tool.uv.sources]` below only applies to
    # this project's own dependencies — naming it transitively changes nothing, which
    # is what the first attempt at this fix discovered.
    "torch",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    # FastAPI's TestClient is a thin wrapper over httpx, so the API can be tested
    # without a server and without a port.
    "httpx",
]

# TORCH FROM PYTORCH'S OWN CPU INDEX, ON LINUX ONLY.
#
# requirements.txt has said since it was written that `pip install torch` on Linux
# brings the CUDA runtime with it, and pins the CPU build against PyTorch's index to
# avoid roughly two gigabytes of GPU libraries on a free tier that has no GPU. On
# 2026-08-24 the deployment log showed that argument had stopped applying: Streamlit
# Community Cloud installs from pyproject.toml and uv.lock when they exist — it says
# so in the build log, warning that more than one requirements file was found — and
# the lock resolved torch from PyPI, so cuda-bindings, cuda-toolkit and triton were
# installed on a machine that cannot use any of them. The build took over ten minutes
# and the first attempt to wake the app timed out.
#
# Naming the index here puts the two paths back in agreement, so that the reason
# written in requirements.txt is true of the deployment that actually happens.
#
# LINUX ONLY, because that index carries no macOS wheels and the PyPI build on macOS
# is already CPU-only. `explicit = true` keeps every other package on PyPI: an index
# added globally would be searched for everything and can resolve a package to
# whatever it happens to mirror.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# SudachiPy ships no type information. Narrowed to that one package rather than
# relaxed globally, so an untyped import anywhere else still fails: the point of
# strict mode is that a new dependency has to be argued for, not waved through.
[[tool.mypy.overrides]]
module = ["sudachipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The modules under test sit at the repository root, not in a src/ package, so the
# root has to be importable whether pytest is run as `pytest` or as `python -m pytest`.
pythonpath = ["."]
