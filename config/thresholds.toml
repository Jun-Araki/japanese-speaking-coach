# Validation thresholds.
#
# Every value here was provisional until week 2 measured it against the dev split.
# What each measurement did and did not establish is written beside the value, and
# "measured" does not always mean "tuned": two of these were set above the whole
# observed range on purpose, and say so.
# Never inline these numbers in code — read them from here.

[reason_language]
# format_compliance_rate asks whether the explanation came back IN ENGLISH
# (docs/ja/glossary.md §5). Naming a Japanese word inside an English sentence is
# not the failure that metric is looking for.
#
# Quoted Japanese is removed first — pointing at 「は」 is how a particle gets
# explained. What is left is measured as: Japanese characters / (Japanese
# characters + Latin letters).
#
# WHY A RATIO AND NOT ZERO — measured on the day 4 baseline run (test, n=20):
# nine reasons were flagged, and every one of them was an English explanation that
# named a Japanese word without quoting it ("the masu-stem of the verb (遅れ)",
# "add です"). A zero-tolerance rule reported the baseline as 55% compliant, which
# a reader takes to mean it answered in Japanese 45% of the time. It did not
# once. Measuring quoting style under the name of a language metric is exactly the
# "language mix-up" trap in the llm-jp-eval critique (PLAN.md §2-4), pointed the
# other way.
#
# 0.25 sits far above the observed inline mentions (a few characters in 200-800)
# and far below a reason actually written in Japanese ("This is 丁寧な言い方では
# ありません。" scores 0.67).
japanese_ratio_max = 0.25

# Reasons that keep Japanese out of quotes are still worth seeing: the correction
# prompt asks for 「」 and the baseline prompt does not. It is recorded per item in
# the run record and deliberately does NOT count against format_compliance_rate —
# one metric, one meaning.

[reply_language]
# The partner's reply has to be in Japanese. Not a style preference: on 2026-08-12
# two of ninety replies came back as the model's own reasoning —
# "THOUGHT: The user said ..." — in English, with the learner's sentence quoted
# inside. A learner would have read it.
#
# Measured as Japanese characters / (Japanese + Latin), over the whole reply. The
# obvious test, "does it contain any Japanese", does not work: both leaks quoted
# the learner and so contained plenty.
#
# The two populations do not overlap at all. All 88 sound replies scored 1.000 —
# no Latin letters anywhere — and the two leaks scored 0.323 and 0.064. Anything
# from 0.33 to 1.0 separates them, so the threshold sits in the middle of that gap
# and says something defensible on its own: the reply has to be more Japanese than
# not. A romanised loanword or an OK in a reply stays well clear.
japanese_share_min = 0.5

[rewrite_too_far]
# A "correction" whose distance from the original exceeds this is treated as a
# different sentence, not a correction, and is discarded by the validation node.
#
# Measured as character-level Levenshtein distance, normalised by the length of
# the longer string.
#
# WHY 0.65 AND NOT 0.5 — measured on real corrections 2026-08-02:
#
#   おはようです      -> おはようございます        0.44
#   ありがとう        -> ありがとうございます      0.50
#   明日行くです      -> 明日行きます              0.33
#   すみません、遅れます -> すみません、遅れそうです  0.25
#   私は日本語を勉強します -> 私は日本語を勉強しています 0.15
#
# Corrections into polite form append long fixed endings to short sentences, so
# they score high on a normalised ratio despite being the single most common and
# most obviously correct type of correction in this app. A threshold of 0.5 would
# discard "ありがとう -> ありがとうございます". Beginner sentences are short, which
# makes the ratio unstable, so the threshold sits well above the observed range.
#
# MEASURED 2026-08-11 against all 73 corrections the baseline produced on the dev
# split (evals/runs/20260811-0752-baseline-dev.json). The ordering came out
# inverted, which settles the value rather than tuning it:
#
#   0.82  eval-028  ご苦労さまです。      -> ありがとうございます。      <- CORRECT
#   0.78  eval-091  あなたのお手伝いは…   -> とても助かりました。         valid
#   0.77  eval-109  私は待ちます。        -> すみません、すぐ行きます。   <- WRONG
#   0.73  eval-068  あなたの朝は元気です。 -> 今日も元気ですね！          valid
#   0.67  eval-025  私を助けて、ありがとう。-> 助かりました。ありがとう…   valid
#
# The largest distance in the whole run belongs to a correction that matches this
# project's own reference answer character for character, and the one correction
# that actually changed the meaning (waiting -> going) scores BELOW it. Fixed
# phrases share no characters with their replacements, so the most obviously right
# corrections score highest. No threshold on character distance separates these:
# saving eval-028 costs eval-109, and 0.65 destroys three valid corrections to
# catch one bad one.
#
# So the threshold goes above the observed range — 0.82 measured, 0.85 set — and
# the check fires on nothing in this run. That is the rule already written above
# ("a discarded valid correction is invisible to the learner and therefore worse
# than a slightly loose threshold") applied to what the data actually says, and it
# is reported as a firing count of zero rather than tuned until it fires.
#
# What still needs catching is the meaning-changing rewrite, and character
# distance is the wrong instrument for it. Not solved by a number here; revisit in
# September, when 250 items give enough of them to see a pattern.
normalised_distance_max = 0.85

# Below this length the normalised ratio is meaningless (one character changed in
# a four-character sentence is 0.25). Short sentences use the absolute distance.
short_sentence_chars = 8
short_sentence_distance_max = 6


[vocabulary_level]
# The AI reply is regenerated if it uses too many words above the learner's level.
# Tokenised with SudachiPy.
#
# The tiers do NOT come from SudachiDict, whatever this comment said before week 2
# looked: SudachiPy exposes surface, lemma, reading and part of speech and nothing
# about how common a word is. They come from the BCCWJ frequency lists, cut by
# corpus coverage — see nlp/frequency.py for the source, the licence handling and
# the boundaries.
#
# Only content words count — nouns, verbs, adjectives, adverbs. Particles and
# auxiliaries are always high-frequency and would dilute the ratio toward zero,
# making the check pass on replies that are in fact too hard.
content_pos = ["名詞", "動詞", "形容詞", "副詞"]

# WHY A RATIO AND NOT ZERO: replies are held to 1-2 sentences, roughly 5-15
# content words. Requiring zero over-level words would trigger regeneration on
# almost every reply, burning latency and tokens for no learning benefit, and a
# single unfamiliar word in context is how vocabulary is actually acquired.
over_level_ratio_max = 0.2

# A word two tiers above the learner's level is rejected regardless of ratio —
# one such word can make a whole reply incomprehensible to a beginner.
absolute_tier_gap_max = 2

# Proper nouns are exempt: names and places have no meaningful frequency tier and
# are unavoidable in self-introduction and workplace scenes.
#
# Numerals joined them on 2026-08-11, from measurement rather than principle. The
# frequency list spells them out (一, 二, 三) and the tokenizer leaves digits as
# digits, so 六時 and 25 arrived as unknown words and would have been reported as
# vocabulary the learner has not met. Four of the fifteen misses over the whole
# evaluation set were numerals.
exempt_pos = ["名詞,固有名詞", "名詞,数詞"]

# Regeneration is attempted at most once, then the reply is used as-is. An
# unbounded loop would stall the conversation, and a slightly hard reply is far
# less damaging than a hang.
max_regenerations = 1

# MEASURED 2026-08-11, 90 replies over 6 scenes x 3 levels, before any
# regeneration existed (evals/runs/20260811-1856-level-compliance.json):
#
#   first-shot compliance   94.4% overall
#                           86.7% beginner / 96.7% upper-beginner / 100% intermediate
#   would-regenerate         5.6% overall, 13.3% at beginner
#
# The rule written here was: if regeneration would fire on more than ~30% of
# replies, the dialogue prompt is wrong and this threshold is the wrong lever.
# It fires on 13.3% at the level that fires most, so the prompt stays as it is.
#
# What that does NOT establish: 0.2 was never swept. The measurement says the
# threshold does not break the conversation, not that it is the best value. Only
# three distinct words went over level across all 90 replies, so there is not
# enough signal here to tune against — revisit in September on real replies.


[retrieval]
# How many articles are handed to the correction model, and the floor a result has
# to clear to count as grounding at all.

# The top 3, as glossary.md §5 has said since week 1. `retrieval_hit_rate` is
# measured over this same 3 and reads RANK ONLY — it never compares against
# score_min. That is deliberate and is the reason the two live in different
# places: if the published hit rate moved with score_min, score_min could be
# tuned until the hit rate looked good, and nothing in the repository would show
# it had been.
top_k = 3

# HOW score_min IS CHOSEN, written before it is measured (2026-08-13).
#
# The obvious rule — "the value that maximises recall of the hand-annotated
# articles" — cannot choose anything. Recall only rises as the floor falls, so the
# rule always answers score_min = 0, at which check 3 never fires and the
# validation node has no third check. A criterion whose answer is fixed before the
# data arrives is not a criterion.
#
# So the rule is inverted, and the recall floor is the part fixed in advance:
#
#   score_min = the LARGEST value at which at least `recall_floor_items` of the
#               grounded items in the THRESHOLD sample still have one of their
#               annotated articles in the top 3 with a score at or above it.
#
# Candidates are the distinct scores actually observed on the threshold sample,
# plus 0, so the maximum is attained rather than approached. Measured on
# evals/retrieval/worksheet.md, first block only — the twenty measurement items
# are not looked at, before or after.
#
# The threshold block holds 10 items, of which 8 have a grounding article and 2
# have none. So the denominator here is 8, not 10.
recall_floor_items = 7

# WHY 7 OF 8 AND NOT 6. The two errors are not symmetric. A floor set too high
# discards grounding for a correction that was right, and check 3 then suppresses
# it — the learner is shown nothing and never learns that anything was wrong. A
# floor set too low only means check 3 fires less often than it could. That is the
# same asymmetry already written under [rewrite_too_far]: a discarded valid
# correction is invisible to the learner and therefore worse than a slightly loose
# threshold. 7 of 8 allows exactly one grounded item to be lost; 6 of 8 allows two,
# which on eight items is a quarter of them.
#
# IF NO VALUE ABOVE 0 REACHES 7 OF 8, the answer is score_min = 0 and it is
# reported as "check 3 could not be operated at this reference size", not patched
# by lowering the floor afterwards. Lowering a floor to make a check fire is how a
# threshold stops meaning anything.
#
# THE TWO `none` ITEMS ARE NOT USED TO CHOOSE. Two items cannot separate anything,
# and picking score_min to make both of them abstain would be fitting a threshold
# to two data points. They are reported as a diagnostic at whatever value the rule
# above returns: how many of the two came back with nothing above it.
#
# score_min itself is written here on 8/15, with the measurement beside it. It is
# deliberately absent until then — config.threshold() raises a KeyError naming
# this file, which is what should happen if anything tries to run check 3 before
# the value it depends on exists.
