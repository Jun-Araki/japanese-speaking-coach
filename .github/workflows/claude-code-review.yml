name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Show review progress as checkboxes in a tracking comment
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first and hold the diff to
            the conventions defined there.

            Focus areas, in priority order:

            1. Correctness
               - Logic errors, unhandled edge cases, incorrect assumptions
               - Missing or wrong error handling

            2. Security
               - XSS and injection risks
               - Missing input validation at trust boundaries
               - Secrets or credentials committed to the repository

            3. Project conventions (see CLAUDE.md)
               - Naming, coding style, and test conventions
               - Tailwind CSS for styling; flag ad-hoc CSS that bypasses it
               - Documentation placement: permanent docs under docs/,
                 work-scoped docs under .steering/[YYYYMMDD]-[title]/
               - Diagrams belong inline (Mermaid or ASCII) in the related
                 document, not in a separate diagrams folder

            4. Maintainability
               - Readability, dead code, needless complexity
               - Documentation and diagrams that no longer match the code

            Guidelines:
            - Write all review comments in Japanese.
            - Use inline comments for issues tied to specific lines.
            - Use a top-level comment for overall assessment.
            - Report severity honestly and include low-confidence findings,
              labelled as such. Do not withhold a finding because it seems
              minor.
            - If the diff looks good, say so plainly instead of inventing
              issues.

          claude_args: |
            --allowedTools "Bash,Glob,Grep,LS,Read,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment"
